<style>
/* Layout: one phone-width column, a fixed bottom tab bar, section labels set in red like manuscript rubrics. */
:root{
  --bg:#EDEFEA; --surface:#F8F9F5; --ink:#17212B; --muted:#5C6772; --line:#D3D8D0;
  --rubric:#9A1F33; --gilt:#86681A; --ok:#2F6B4A; --warn:#9A5B0E; --bad:#A3262E; --on-accent:#FFF8F2;
  --display:"Brygada 1918",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#182029; --ink:#E7E5DC; --muted:#98A2AD; --line:#2A3440;
  --rubric:#E77A88; --gilt:#D4B25A; --ok:#6FC096; --warn:#E0A552; --bad:#F08A8A; --on-accent:#1A0E10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#182029; --ink:#E7E5DC; --muted:#98A2AD; --line:#2A3440;
  --rubric:#E77A88; --gilt:#D4B25A; --ok:#6FC096; --warn:#E0A552; --bad:#F08A8A; --on-accent:#1A0E10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;font-variant-numeric:tabular-nums}
.wrap{max-width:34rem;margin-inline:auto;padding-block:14px 6.5rem;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--display);font-weight:600;font-size:1.35rem;color:var(--rubric);margin:0}
#status{font-size:.8rem;color:var(--muted)}
#view{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance}
.rub{font-size:.74rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--rubric);margin:0}
.sec{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.note{color:var(--muted);font-size:.86rem;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1 1 8rem;min-width:0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .when{font-family:var(--display);font-size:1.3rem;font-weight:600;text-align:center;flex:1;min-width:0}
.nav .when small{display:block;font-family:var(--body);font-size:.78rem;font-weight:500;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--rubric);outline-offset:2px}
.btn{background:var(--rubric);color:var(--on-accent);border:0;border-radius:9px;padding:.6rem .9rem;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:.4rem .65rem;font-size:.86rem}
.ico{background:transparent;border:1px solid var(--line);border-radius:9px;width:2.5rem;height:2.5rem;font-size:1.1rem;flex:none}
.x{background:transparent;border:0;color:var(--muted);width:2.2rem;height:2.2rem;font-size:1.2rem;flex:none}
.in,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:.5rem .6rem;width:100%;min-width:0}
textarea{min-height:5rem;resize:vertical}
.in.amt{width:6.2rem;text-align:right;flex:none}
.in.num{width:4.6rem;text-align:right;flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);flex:1 1 7rem;min-width:0}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:.65rem 0}
.list>.item:first-child,.list>.catrow:first-child{border-top:0}
.box{width:1.5rem;height:1.5rem;border:1.5px solid var(--muted);border-radius:6px;flex:none;display:grid;place-items:center;font-size:.9rem;color:transparent}
.on .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.on .txt{color:var(--muted);text-decoration:line-through}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.streak{font-size:.78rem;color:var(--gilt);font-weight:600;flex:none}

.hero .big{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.15}
.chip{display:inline-block;font-size:.76rem;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:.15rem .6rem;color:var(--muted)}
.chip.fast{color:var(--rubric);border-color:var(--rubric)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tog{background:transparent;border:1px solid var(--line);border-radius:99px;padding:.45rem .8rem;font-size:.9rem}
.tog.on{background:var(--rubric);border-color:var(--rubric);color:var(--on-accent)}
.step{display:flex;align-items:center;gap:8px}
.step b{min-width:2.4rem;text-align:center;font-size:1.1rem}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gilt)}
.banner{border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--surface)}
.banner .big{font-family:var(--display);font-size:1.7rem;font-weight:600}
.banner.zero{border-color:var(--ok)} .banner.zero .big{color:var(--ok)}
.banner.left .big{color:var(--warn)} .banner.over{border-color:var(--bad)} .banner.over .big{color:var(--bad)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:.55rem 0}
.catrow .nm{min-width:0;overflow-wrap:anywhere}
.catrow .sub{display:block;font-size:.78rem;color:var(--muted)}
.rem{min-width:4.6rem;text-align:right;font-weight:600;font-size:.92rem}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ghead span{font-size:.82rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.week .col{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted)}
.week .v{width:100%;height:5rem;background:var(--line);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.week .v i{display:block;width:100%;background:var(--rubric)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:1.3rem}
.stat span{font-size:.8rem;color:var(--muted)}
.focus{font-family:var(--display);font-size:1.15rem;font-weight:500;margin:0;text-wrap:pretty}
.item .tag{font-size:.74rem;font-weight:600;color:var(--gilt);flex:none}
.item .lbl{display:block;font-size:.76rem;color:var(--muted)}
.on .txt:has(.lbl){text-decoration:none}
.on .txt:has(.lbl) .tt{text-decoration:line-through}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.sb{width:2.4rem;height:2.4rem;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:.9rem}
.sb.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ex{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.ex:first-of-type{border-top:0;padding-top:0}
.ex .ghead .nm{font-weight:600;font-size:1rem;color:var(--ink);min-width:0}
.ex .ghead .dose{font-size:.82rem;font-weight:600;color:var(--gilt);white-space:nowrap}
.adv{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:8px;font-size:.94rem}
.ai{white-space:pre-wrap;font-size:.94rem;border-top:1px solid var(--line);padding-top:10px}
.ai:empty{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs div{display:flex;width:100%;max-width:34rem}
.tabs button{flex:1;min-width:0;background:transparent;border:0;border-top:2px solid transparent;padding:.7rem 0;font-weight:600;font-size:.8rem;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--rubric);border-top-color:var(--rubric)}
@media (prefers-reduced-motion:no-preference){.bar>i,.week .v i{transition:all .25s}}
</style>
</head>

}

  h+="</div></section>";
  h+='<section class="sec"><p class="rub">Path of conduct</p><div class="card list">';
  PATH.forEach(function(t){var st=pstate(t),n=0;dates.forEach(function(ds){var d=S.days[ds];if(d&&d.path&&d.path[t.k])n++});
    h+='<div class="item"><span class="txt">'+esc(t.name)+'<span class="lbl">'+(st.stage>=3?"All steps complete":"Step "+(st.stage+1)+" of 3 · "+esc(t.stages[st.stage][0]))+'</span></span><span class="streak">'+n+" of 7 days</span></div>"});
  h+="</div></section>";
  h+='<section class="sec"><p class="rub">This month I am working on</p><div class="card">';

}

/* ---------- render ---------- */
var VIEWS={today:vToday,grow:vGrow,path:vPath,train:vTrain,budget:vBudget,review:vReview};
function paint(full){
  if(S.error){view.innerHTML='<section class="card"><h2>Your entries could not be opened</h2><p class="note">Nothing was changed. Reload the page to try again.</p></section>';return}
  var html=VIEWS[S.tab]();
  if(full!==false){view.innerHTML=html}
  else{var t=document.createElement("div");t.innerHTML=html;
    view.querySelectorAll("[data-live]").forEach(function(el){var n=t.querySelector('[data-live="'+el.dataset.live+'"]');if(n){el.innerHTML=n.innerHTML;el.className=n.className}})}
  document.querySelectorAll(".tabs button").forEach(function(b){if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
}
async function ensureDay(date){
  if(S.days[date])return;
  try{S.days[date]=(await load("d_"+date))||newDay(date)}catch(e){S.days[date]=newDay(date)}
}
async function ensureBudget(m){
  var pm=shiftMonth(m,-1);
  try{
    if(S.budgets[pm]===undefined)S.budgets[pm]=await load("b_"+pm);
    if(S.budgets[m]===undefined)S.budgets[m]=await load("b_"+m);
  }catch(e){if(S.budgets[m]===undefined)S.budgets[m]=null}
  if(S.tab==="budget"&&S.month===m)paint();
}
function docFor(name){return name==="day"?day():name==="settings"?S.settings:S.budgets[S.month]}
function saveFor(name){name==="day"?saveDay():name==="settings"?saveSettings():saveBudget()}

/* ---------- events ---------- */
document.querySelector(".tabs").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]");if(!b||S.error||!S.settings)return;
  S.tab=b.dataset.tab;S.edit=false;paint();window.scrollTo(0,0);
  if(S.tab==="budget")ensureBudget(S.month);
});
view.addEventListener("change",function(e){
  var el=e.target,path=el.dataset.path;if(!path)return;
  var v=el.value,ty=el.dataset.type;
  if(ty==="money"){v=cents(v);el.value=mv(v)}else if(ty==="num"){v=num(v)}
  setPath(docFor(el.dataset.doc),path,v);saveFor(el.dataset.doc);paint(false);
});
view.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act,d=day(),st=S.settings,b=S.budgets[S.month],i=+el.dataset.i,g=+el.dataset.g,c=+el.dataset.c,q=function(id){return document.getElementById(id)};
  if(a==="day"){var nd=shift(S.date,+el.dataset.d);if(nd>iso(new Date()))return;S.date=nd;ensureDay(nd).then(function(){paint()});return}
  if(a==="month"){S.month=shiftMonth(S.month,+el.dataset.d);S.edit=false;paint();ensureBudget(S.month);return}
  if(a==="edit"){S.edit=!S.edit}
  else if(a==="habit"){d.habits[el.dataset.id]=!d.habits[el.dataset.id];saveDay()}
  else if(a==="pri"){d.pri[i].done=!d.pri[i].done;saveDay()}
  else if(a==="mood"){d.mood=d.mood===i?0:i;saveDay()}
  else if(a==="hour"){d.hours[i]=!d.hours[i];saveDay()}
  else if(a==="fast"){d.fast=!isFast(d);saveDay()}
  else if(a==="step"){var p=el.dataset.path;d[p]=Math.max(0,(d[p]||0)+(+el.dataset.d)*(p==="prostrations"?(+el.dataset.d>0?1:1):1));saveDay()}
  else if(a==="addHabit"){var nm=q("nh-name").value.trim();if(!nm)return;st.habits.push({id:uid(),area:q("nh-area").value,name:nm});saveSettings()}
  else if(a==="delHabit"){st.habits=st.habits.filter(function(x){return x.id!==el.dataset.id});saveSettings()}
  else if(a==="addBook"){var ti=q("nb-title").value.trim();if(!ti)return;st.books.push({id:uid(),title:ti,total:Math.max(0,Math.round(num(q("nb-total").value))),read:0});saveSettings()}
  else if(a==="delBook"){st.books.splice(i,1);saveSettings()}
  else if(a==="pages"){var n=Math.round(num(q("pg-"+i).value));if(n<=0)return;st.books[i].read+=n;d.pages=(d.pages||0)+n;saveSettings();saveDay()}
  else if(a==="newBudget"){S.budgets[S.month]=starterBudget(S.month);saveBudget()}
  else if(a==="copyBudget"){var pv=S.budgets[shiftMonth(S.month,-1)],ps=sums(pv),nb=clone(pv);nb.month=S.month;nb.tx=[];
    nb.groups.forEach(function(gr){gr.cats.forEach(function(ct){ct.carry=ct.fund?(ct.carry||0)+(ct.planned||0)-(ps.spent[ct.id]||0):0})});S.budgets[S.month]=nb;saveBudget()}
  else if(a==="ptoggle"||a==="pest"||a==="pnext"||a==="prestart"){
    var tk=PATH.filter(function(x){return x.k===el.dataset.k})[0],ps2=pstate(tk),fo=focusOf(tk);
    if(a==="ptoggle"){if(!fo)return;if(d.path[tk.k]===fo)delete d.path[tk.k];else d.path[tk.k]=fo;saveDay();paint();return}
    if(a==="pest"&&fo){ps2.est[fo]=true;ps2.focus=null}
    if(a==="pnext"){ps2.stage++;ps2.focus=null}
    if(a==="prestart"){ps2.stage=0;ps2.est={};ps2.focus=null}
    saveSettings()}
  else if(a==="pfocus"){var pidv=el.dataset.id,tr=ptrack(pidv),ps3=pstate(tr);if(ps3.est[pidv])ps3.est[pidv]=false;ps3.focus=pidv;saveSettings()}
  else if(a==="backup"){backup();return}
  else if(a==="restoreYes"){applyRestore();return}
  else if(a==="restoreNo"){S.pendingRestore=null;S.restoreError=""}
  else if(a==="trainMode"){st.train=st.train||{};st.train.mode=el.dataset.m;saveSettings()}
  else if(a==="trainDone"){d.trainDone=!d.trainDone;saveDay()}
  else if(a==="setTap"){d.train=d.train||{};var lgx=d.train[el.dataset.ex]||(d.train[el.dataset.ex]={}),nn=+el.dataset.n;lgx.s=(lgx.s||0)>=nn?nn-1:nn;saveDay()}
  else if(a==="lessonNext"){S.lessonOff=(S.lessonOff||0)+1}
  else if(a==="lessonDone"){var lt=lesson()[2];d.lesson=d.lesson===lt?"":lt;saveDay()}
  else if(a==="addLib"){var bt=el.dataset.title;if(!st.books.some(function(x){return x.title.toLowerCase()===bt.toLowerCase()})){st.books.push({id:uid(),title:bt,total:0,read:0});saveSettings()}}
  else if(a==="addSub"){(st.subs=st.subs||[]).push({id:uid(),name:"",amount:0,cycle:"month",next:"",status:"keep"});saveSettings()}
  else if(a==="delSub"){st.subs.splice(i,1);saveSettings()}
  else if(a==="subStatus"){var sx=st.subs[i];sx.status={keep:"review",review:"cancel",cancel:"keep"}[sx.status||"keep"];saveSettings()}
  else if(a==="applyCuts"){var mvd=0,dest=null;b.groups.forEach(function(gr){var gn=gr.name.toLowerCase();if(gn==="saving"&&!dest)dest=gr.cats[0];if(gn==="giving"||gn==="saving")return;gr.cats.forEach(function(ct){var pc=(b.cuts||{})[ct.id]||0;if(pc&&ct.planned>0){var cut=Math.round(ct.planned*pc/100);ct.planned-=cut;mvd+=cut}})});
    if(!dest){var sg2={id:uid(),name:"Saving",cats:[{id:uid(),name:"Emergency fund",planned:0,carry:0,fund:true}]};b.groups.splice(1,0,sg2);dest=sg2.cats[0]}
    dest.planned=(dest.planned||0)+mvd;b.cuts={};saveBudget()}
  else if(a==="fillSugg"){var si=sums(b).inc;if(!si){var fi=view.querySelector('[data-path="income.0.amount"]');if(fi)fi.focus();setStatus("Enter your income first");return}b.groups.forEach(function(gr){gr.cats.forEach(function(ct){var v=sugg(ct,si);if(!ct.planned&&v)ct.planned=v})});saveBudget()}
  else if(a==="askAi"){askAi();return}
  else if(a==="addIncome"){b.income.push({id:uid(),name:"",amount:0});saveBudget()}
  else if(a==="delIncome"){b.income.splice(i,1);saveBudget()}
  else if(a==="addCat"){var cn=q("nc-"+g).value.trim();if(!cn)return;b.groups[g].cats.push({id:uid(),name:cn,planned:0,carry:0});saveBudget()}
  else if(a==="delCat"){b.groups[g].cats.splice(c,1);saveBudget()}
  else if(a==="fund"){b.groups[g].cats[c].fund=!b.groups[g].cats[c].fund;saveBudget()}
  else if(a==="addTx"){var am=cents(q("tx-amt").value);if(am<=0||!q("tx-cat").value){q("tx-amt").focus();return}b.tx.push({id:uid(),date:q("tx-date").value||iso(new Date()),cat:q("tx-cat").value,amount:am,note:q("tx-note").value.trim()});saveBudget()}
  else if(a==="delTx"){b.tx=b.tx.filter(function(x){return x.id!==el.dataset.id});saveBudget()}
  else if(a==="addDebt"){st.debts.push({id:uid(),name:"",bal:0,min:0});saveSettings()}
  else if(a==="delDebt"){st.debts.splice(i,1);saveSettings()}
  else return;
  paint();
});

async function askAi(){
  var b=S.budgets[S.month];if(!b||!S.sample||S.aiBusy)return;
  var s=sums(b),lines=[];
  b.groups.forEach(function(g){g.cats.forEach(function(c){lines.push(g.name+" / "+c.name+": planned "+fm(c.planned)+", spent "+fm(s.spent[c.id]||0)+(sugg(c,s.inc)!=null?", guideline "+fm(sugg(c,s.inc)):""))})});
  var gl=S.settings.saveGoal||{},debts=S.settings.debts.map(function(x){return(x.name||"Debt")+": balance "+fm(x.bal)+", minimum "+fm(x.min)}).join("; ")||"none";
  var prompt="You are a careful, encouraging budget coach for an Oriental Orthodox Christian who uses a zero-based budget and gives the tithe first. Using only the data below, give 4 to 6 short, specific suggestions to spend wisely and save more this month. Name categories and dollar amounts. Never suggest cutting the tithe. Plain text only: each suggestion on its own line starting with '- ', no headings or bold. End with one line noting this is general guidance, not professional financial advice.\n\nMonth: "+monthName(S.month)+"\nIncome: "+fm(s.inc)+"\nNot yet assigned: "+fm(s.left)+"\nLines:\n"+lines.join("\n")+"\nDebts: "+debts+"\nSavings goal: "+(gl.amount?fm(gl.amount)+(gl.name?" for "+gl.name:"")+" in "+(gl.months||"?")+" months":"none");
  S.aiBusy=true;S.ai="";paint();
  try{
    var r=await S.sample(prompt,{cache:false,onText:function(t){S.ai=t.text;var el=document.getElementById("ai-out");if(el)el.textContent=t.text}});
    S.ai=r.text;
  }catch(e){
    if(e&&e.code==="not_granted")S.sample=null;
    S.ai=e&&e.code==="rate_limited"?"Too many requests just now. Try again in a minute.":e&&e.code==="not_granted"?"":"Advice from Claude is not available right now. The suggestions above still apply.";
  }
  S.aiBusy=false;if(S.tab==="budget")paint();
}


/* ---------- your data: backup and restore (stored on this phone) ---------- */
function meta(){try{return JSON.parse(localStorage.getItem("rol:meta")||"{}")}catch(e){return{}}}
function setMeta(m){try{localStorage.setItem("rol:meta",JSON.stringify(m))}catch(e){}}
function allData(){var o={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("rol:")===0&&k!=="rol:meta"){try{o[k.slice(4)]=JSON.parse(localStorage.getItem(k))}catch(e){}}}}catch(e){}return{app:"rule-of-life",version:1,exported:new Date().toISOString(),docs:o}}
function daysSinceBackup(){var m=meta();if(!m.lastBackup)return null;return Math.floor((Date.now()-new Date(m.lastBackup).getTime())/864e5)}
function hasEntries(){return Object.keys(allData().docs).length>0}
async function backup(){
  flushAll();
  var json=JSON.stringify(allData(),null,1),name="rule-of-life-backup-"+iso(new Date())+".json",file;
  try{file=new File([json],name,{type:"application/json"})}catch(e){file=null}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"Rule of Life backup"});var m=meta();m.lastBackup=new Date().toISOString();setMeta(m);setStatus("Backup saved");paint();return}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  var blob=new Blob([json],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  var m2=meta();m2.lastBackup=new Date().toISOString();setMeta(m2);setStatus("Backup saved");paint();
}
function readRestore(file){
  var r=new FileReader();
  r.onload=function(){
    try{var o=JSON.parse(r.result);if(!o||o.app!=="rule-of-life"||typeof o.docs!=="object")throw 0;S.pendingRestore=o;S.restoreError=""}
    catch(e){S.pendingRestore=null;S.restoreError="That file is not a Rule of Life backup. Choose a file named rule-of-life-backup."}
    paint();
  };
  r.readAsText(file);
}
function applyRestore(){
  var o=S.pendingRestore;if(!o)return;
  try{
    var del=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("rol:")===0&&k!=="rol:meta")del.push(k)}
    del.forEach(function(k){localStorage.removeItem(k)});
    Object.keys(o.docs).forEach(function(id){localStorage.setItem("rol:"+id,JSON.stringify(o.docs[id]))});
  }catch(e){S.restoreError="The backup could not be written. Free some space on your phone and try again.";paint();return}
  location.reload();
}
function vData(){
  var n=daysSinceBackup(),h='<section class="sec"><p class="rub">Your data</p><div class="card">';
  h+='<p class="note">Everything you enter is stored on this iPhone only. Back up regularly and save the file to iCloud Drive, so you can restore it if you change or lose your phone.</p>';
  h+='<p class="note">'+(n==null?"No backup yet.":n===0?"Last backup: today.":"Last backup: "+n+" day"+(n>1?"s":"")+" ago.")+"</p>";
  h+='<div class="row"><button class="btn" data-act="backup">Back up now</button><label class="btn ghost" for="restore-file" style="cursor:pointer">Restore from a backup</label><input type="file" id="restore-file" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>';
  if(S.restoreError)h+='<p class="note neg">'+esc(S.restoreError)+"</p>";
  if(S.pendingRestore){var c=Object.keys(S.pendingRestore.docs).length,dt=S.pendingRestore.exported?new Date(S.pendingRestore.exported).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}):"an unknown date";
    h+='<div class="banner over"><p class="note">This replaces everything on this phone with the backup from '+esc(dt)+" ("+c+" records). This cannot be undone.</p><div class=\"row\"><button class=\"btn\" data-act=\"restoreYes\">Replace with backup</button><button class=\"btn ghost\" data-act=\"restoreNo\">Cancel</button></div></div>"}
  h+="</div></section>";
  return h
}
function backupNudge(){
  if(!hasEntries())return"";var n=daysSinceBackup();if(n!=null&&n<7)return"";
  return'<section class="card"><div class="ghead"><h2>Back up your entries</h2><button class="btn sm" data-act="backup">Back up</button></div><p class="note">'+(n==null?"You have not made a backup yet.":"Your last backup was "+n+" days ago.")+" Save it to iCloud Drive to keep your entries safe.</p></section>"
}
view.addEventListener("change",function(e){if(e.target&&e.target.id==="restore-file"&&e.target.files&&e.target.files[0])readRestore(e.target.files[0])});

/* ---------- start ---------- */
(async function boot(){
  var db=null,user=null,id=null;
  if(window.claude&&window.claude.use){
    window.claude.use("sample").then(function(x){S.sample=x;if(x&&S.tab==="budget"&&S.settings)paint()},function(){});
    try{var r=await Promise.all([window.claude.use("db"),window.claude.use("user")]);db=r[0];user=r[1]}catch(e){}
    if(db&&user){try{id=await user.id()}catch(e){}}
  }
  if(db&&id)col=db.collection("data/users/"+id);else S.local=true;
  try{
    var st=await load("settings");S.settings=Object.assign(defaults(),st||{});
    if(col){var snap=await col.where("kind","==","day").orderBy("date","desc").limit(45).get();snap.docs.forEach(function(x){var v=clone(x.data());S.days[v.date]=Object.assign(newDay(v.date),v)})}
    else{try{for(var k=0;k<localStorage.length;k++){var key=localStorage.key(k);if(key&&key.indexOf("rol:d_")===0){var v=JSON.parse(localStorage.getItem(key));S.days[v.date]=Object.assign(newDay(v.date),v)}}}catch(e){}}
  }catch(e){if(!S.settings){S.error=true}}
  if(S.local&&!S.error)setStatus("");
  paint();
})();
})();
